<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>grimexframe.help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
    <link rel="preload" href="assets/fonts/blocks.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=28">

    <!-- ===== Open Graph / Telegram / Discord ===== -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://grimexframe.help/">
    <meta property="og:title" content="grimexframe.help">
    <meta property="og:description" content="⊹ інᴛᴇᴘᴀᴋᴛиʙний пᴏᴘᴛᴀʌ">
    <meta property="og:image" content="https://grimexframe.help/assets/IMG_1627.jpeg">

    <!-- ===== Twitter Cards ===== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="grimexframe.help">
    <meta name="twitter:description" content="⊹ інᴛᴇᴘᴀᴋᴛиʙний пᴏᴘᴛᴀʌ">
    <meta name="twitter:image" content="https://grimexframe.help/assets/IMG_1627.jpeg">
</head>

<body>
    <canvas id="cosmicCanvas"></canvas>

    <main class="journal-wrapper">
        <div class="home-hub">
            <button class="hub-small hub-about" id="aboutBtn" type="button" aria-controls="aboutPopup" aria-expanded="false">
                <img src="assets/itchio-pxl-retro-computer-icons-set-110-item60.png" alt="">
                <span>ABOUT</span>
            </button>
            <button class="world-btn" type="button" data-modal-trigger="worldModal" aria-label="Socials">
                <img src="assets/world.png" alt="">
                <span>SOCIALS</span>
            </button>
        </div>
    </main>

    <!-- ABOUT: маленькое окошко, появляется сверху с глитчем -->
    <div id="aboutPopup" class="about-popup" role="dialog" aria-label="About" hidden>
        <div class="about-popup-header">
            <span class="modal-title-text">about</span>
            <button class="modal-close-btn about-close" type="button" id="aboutClose"><img src="assets/close.png" alt="close"></button>
        </div>
        <p class="about-tags">#dev #design #tattoo #diygear #barbering</p>
        <button class="about-resume" type="button" id="aboutResume" data-modal-trigger="resumeModal">
            <img src="assets/itchio-pxl-retro-computer-icons-set-110-item38.png" alt="">
            <span>RESUME</span>
        </button>
    </div>

    <!-- Кнопка внизу справа -> модалка ZONE (TXT / PAINT / DIYGEAR / GAME) -->
    <button class="zone-fab" type="button" data-modal-trigger="telegramModal" aria-label="Tools">
        <img src="assets/recycle_bin_full.png" alt="">
        <span>TOOLS</span>
    </button>

    <!-- ===== MODALS ===== -->

    <!-- ===== WORLD modal: вкладки-иконки ===== -->
    <div id="worldModal" class="modal-overlay">
        <div class="modal-content" style="max-width:600px;">
            <div class="modal-header">
                <span class="modal-title-text">socials</span>
                <button class="modal-close-btn" data-modal="worldModal"><img src="assets/close.png" alt="close"></button>
            </div>
            <div class="modal-inner" style="padding:0;">
                <div class="world-layout">
                    <div class="world-tabs" id="worldTabs" role="tablist">
                        <button type="button" class="world-tab active" data-tab="threads" role="tab" aria-label="Threads"><img src="assets/threads_icon_bg.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="instagram" role="tab" aria-label="Instagram"><img src="assets/Instagram.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="telegram" role="tab" aria-label="Telegram"><img src="assets/Telegram.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="tiktok" role="tab" aria-label="TikTok"><img src="assets/TikTok.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="pinterest" role="tab" aria-label="Pinterest"><img src="assets/Pinterest.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="spotify" role="tab" aria-label="Spotify"><img src="assets/Spotify.png" alt=""></button>
                        <button type="button" class="world-tab" data-tab="youtube" role="tab" aria-label="YouTube"><img src="assets/Youtube.png" alt=""></button>
                    </div>

                    <div class="world-content" id="worldContent">

                        <!-- THREADS (бывший twitter / дайджест) -->
                        <div class="world-pane active" data-pane="threads">
                            <div class="carousel-section">
                                <div class="carousel" id="mainCarousel">
                                    <img src="assets/mx1.jpg" class="active">
                                    <img src="assets/mx2.jpg">
                                </div>
                                <div class="hashtag-row"><span class="hashtag text-secondary">#layoutporn</span></div>
                            </div>
                            <p class="text-secondary" style="margin:16px 0 12px; text-align:center;">creative vision lab</p>
                            <div style="display:flex; justify-content:center;">
                                <button type="button" data-href="https://x.com" data-modal-close="worldModal" aria-label="Twitter / X" style="background:transparent; border:0; padding:0; cursor:pointer; appearance:none; -webkit-appearance:none;">
                                    <img src="assets/twit.png" alt="Twitter / X" style="width:64px; height:64px; object-fit:contain; image-rendering:pixelated; display:block; background:transparent;">
                                </button>
                            </div>
                            <div style="width:100%; margin-top:16px;">
                                <a class="twitter-timeline" data-theme="dark" data-height="500" href="https://x.com/grimexframe?ref_src=twsrc%5Etfw">Posts by grimexframe</a>
                            </div>
                        </div>

                        <!-- INSTAGRAM -->
                        <div class="world-pane" data-pane="instagram">
                            <iframe data-src="https://cdn.lightwidget.com/widgets/2741a0351a4f571c91a98cb43e1b8ac1.html"
                                    scrolling="no" allowtransparency="true" class="lightwidget-widget"
                                    style="width:100%; border:0; overflow:hidden; min-height:300px;"></iframe>
                        </div>

                        <!-- TELEGRAM -->
                        <div class="world-pane" data-pane="telegram">
                            <iframe data-src="https://widget.wptelegram.pro/s/grimexframe?theme=auto&hideRightColumn=0&scrollbar=custom"
                                    width="100%" height="600" frameborder="0" title="Telegram feed"
                                    style="border:0; display:block; width:100%; min-height:600px;"></iframe>
                        </div>

                        <!-- TIKTOK: creator embed -->
                        <div class="world-pane" data-pane="tiktok">
                            <div class="tt-wrap">
                                <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@grimexframe" data-unique-id="grimexframe" data-embed-type="creator" style="max-width: 780px; min-width: 0; margin: 0;">
                                    <section>
                                        <a target="_blank" rel="noopener noreferrer" href="https://www.tiktok.com/@grimexframe?refer=creator_embed">@grimexframe</a>
                                    </section>
                                </blockquote>
                            </div>
                        </div>

                        <!-- PINTEREST -->
                        <div class="world-pane" data-pane="pinterest">
                            <!-- data-mode="user": лента профиля со всеми пинами; "board": одна доска (нужен полный data-board-url) -->
                            <div class="pin-widget" id="worldPinWidget" data-mode="user"
                                 data-profile-url="https://www.pinterest.com/grimexframe/"
                                 data-board-url="https://www.pinterest.com/grimexframe/%E1%B4%9B%E1%B4%80%E1%B4%9B%E1%B4%9B%E1%B4%8F%E1%B4%8F/">
                                <div class="pin-embed" id="worldPinEmbed"></div>
                            </div>
                        </div>

                        <!-- SPOTIFY -->
                        <div class="world-pane" data-pane="spotify">
                            <iframe style="border-radius:12px; display:block;" data-src="https://open.spotify.com/embed/playlist/0kMWW4ysJKIn3ilimBPotj?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
                        </div>

                        <!-- YOUTUBE: автообновляемая лента загрузок канала (UC... -> UU...) -->
                        <div class="world-pane" data-pane="youtube">
                            <div class="yt-wrap">
                                <iframe data-src="https://www.youtube.com/embed/videoseries?list=UUdh3ctzhUuxiRXZptFqvG3g&rel=0&modestbranding=1"
                                        title="YouTube uploads" frameborder="0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                        allowfullscreen></iframe>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ===== ZONE modal: TXT / PAINT / DIYGEAR / GAME ===== -->
    <div id="telegramModal" class="modal-overlay">
        <div class="modal-content" style="max-width:600px;">
            <div class="modal-header">
                <span class="modal-title-text">zone</span>
                <button class="modal-close-btn" data-modal="telegramModal"><img src="assets/close.png" alt="close"></button>
            </div>
            <div class="modal-inner" style="display:flex; flex-direction:column; padding:0; gap:0;">
                <div style="display:flex; flex:1; min-height:0;">
                    <div class="tg-forum-tabs" id="tgForumTabs">
                        <div class="tg-forum-tab active" data-tab="garage"><span>#️⃣</span><span class="tg-tab-label">TXT</span></div>
                        <div class="tg-forum-tab" data-tab="design"><span>🎨</span><span class="tg-tab-label">PAINT</span></div>
                        <div class="tg-forum-tab" data-tab="diygear"><span>🏴‍☠️</span><span class="tg-tab-label">DIYGEAR</span></div>
                        <div class="tg-forum-tab" data-tab="development"><span>🎮</span><span class="tg-tab-label">GAME</span></div>
                    </div>

                    <div class="tg-forum-content" id="tgForumContent">

                        <!-- ===== TXT: стайлер ===== -->
                        <div class="tg-tab-content active" data-content="garage">
                            <div style="padding:20px; display:flex; flex-direction:column; gap:20px; align-items:center;">
                                <div class="styler-embedded">
                                    <input type="text" id="garageFontInput" class="styler-input" placeholder="TYPE TEXT" autocomplete="off" spellcheck="false">
                                    <div class="styler-preview" id="garageStylerPreview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- ===== PAINT: артборд + кнопка paint + feed ===== -->
                        <div class="tg-tab-content" data-content="design">
                            <div class="page-content" style="padding: 20px;">
                                <div class="art-feed-row" style="display:grid; grid-template-columns:auto auto; grid-template-areas:'art feed' 'paint .'; align-items:center; justify-items:center; justify-content:center; gap:12px;">
                                    <div class="art-block" style="grid-area:art;">
                                        <img id="currentArtPreview" src="assets/art.jpg" alt="Art">
                                    </div>
                                    <div class="archive-block text-primary" id="archiveBtn" style="grid-area:feed;">
                                        <img src="assets/archive.png" alt="Archive" class="archive-img">
                                        <span class="archive-label">feed</span>
                                    </div>
                                    <div class="paint-cell" style="grid-area:paint;">
                                        <img src="assets/paint.png" alt="Paint" id="paintJournalBtn" class="paint-trigger-img">
                                        <span class="control-label text-primary">paint</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ===== DIYGEAR: конструктор ===== -->
                        <div class="tg-tab-content" data-content="diygear">
                            <div class="page-content" style="padding: 20px;">
                                <section class="constructor-panel">
                                    <h2 class="constructor-title">Constructor</h2>
                                    <div class="merch-constructor">
                                        <div class="tshirt-preview">
                                            <img src="assets/tshirt.jpeg" alt="T-shirt">
                                            <canvas id="printCanvas"></canvas>
                                        </div>
                                        <div class="constructor-controls">
                                            <label for="imageUpload" class="upload-label"><span>choose file</span></label>
                                            <input type="file" id="imageUpload" accept="image/*" style="display:none;">
                                            <button class="universal-btn" id="resetPrint" type="button">
                                                <span class="btn-inner"><span>CLEAR</span></span>
                                            </button>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>

                        <!-- ===== GAME: топ тетриса + переход ===== -->
                        <div class="tg-tab-content" data-content="development">
                            <div class="dev-tab-inner">
                                <h4 class="top-title text-primary" style="margin:0;">TOP PLAYERS</h4>
                                <div class="top-players-framed">
                                    <div class="top-players-list"></div>
                                </div>
                                <a class="dev-tetris-img" href="tetris.html" target="_blank" aria-label="Tetris">
                                    <img src="assets/tetris.png" alt="TETRIS">
                                    <span class="dev-tetris-label">ENTER</span>
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- feed (из вкладки PAINT) -->
    <div id="stubModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title-text" id="stubModalTitle">feed</span>
                <button class="modal-close-btn" data-modal="stubModal"><img src="assets/close.png" alt="close"></button>
            </div>
            <div class="modal-inner">
                <div id="feedContainer" class="feed-container"></div>
            </div>
        </div>
    </div>

    <div id="feedPreviewModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title-text">ART PREVIEW</span>
                <button class="modal-close-btn" data-modal="feedPreviewModal"><img src="assets/close.png" alt="close"></button>
            </div>
            <div class="modal-inner feed-preview-inner">
                <img id="feedPreviewImage" alt="Feed art preview">
            </div>
        </div>
    </div>

    <!-- ===== RESUME modal ===== -->
    <div id="resumeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title-text">resume</span>
                <button class="modal-close-btn" data-modal="resumeModal"><img src="assets/close.png" alt="close"></button>
            </div>
            <div class="modal-inner" style="padding:24px; text-align:center;">
                <p class="text-secondary" style="margin:0;">coming soon</p>
            </div>
        </div>
    </div>

    <script src="js/script.js?v=19"></script>
    <script src="js/cosmic-bg.js"></script>
</body>

</html>
