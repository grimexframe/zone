name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'backend/bot/**'
      - 'backend/proxy/**'
      - '.github/workflows/deploy-workers.yml'

jobs:
  deploy-bot:
    name: Deploy morstrixbot Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (bot)
        working-directory: backend/bot
        run: npm install
      
      - name: Deploy bot to Cloudflare
        working-directory: backend/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
  
  deploy-proxy:
    name: Deploy api-proxy-morstrix Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (proxy)
        working-directory: backend/proxy
        run: npm install
      
      - name: Deploy proxy to Cloudflare
        working-directory: backend/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
